name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:ts

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Share the built interface
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  engine:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> ../build/.cache

      - name: Install desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev librsvg2-dev libpulse-dev libgstreamer1.0-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path backend/Cargo.toml --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked --features desktop -- -D warnings

      - name: Engine tests
        run: cargo test --manifest-path backend/Cargo.toml --locked

      - name: Compile the desktop application
        if: runner.os != 'Linux'
        run: cargo check --manifest-path backend/Cargo.toml --locked --features desktop
