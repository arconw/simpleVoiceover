name: Windows build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> ../build/.cache

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Build desktop executable
        run: cargo build --manifest-path backend/Cargo.toml --release --locked --features desktop

      - name: Name the executable
        id: package
        shell: bash
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          mkdir -p build
          cp build/.cache/release/simpleVoiceover.exe "build/simpleVoiceover-v${version}.exe"
          echo "path=build/simpleVoiceover-v${version}.exe" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned executable
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: simpleVoiceover-windows-x64-unsigned
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Sign the executable
        id: sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'simpleVoiceover' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed

      - name: Use the signed executable
        if: ${{ steps.sign.outcome == 'success' }}
        shell: bash
        run: cp -f "build/signed/$(basename '${{ steps.package.outputs.path }}')" "${{ steps.package.outputs.path }}"

      - name: Verify the signature
        if: ${{ steps.sign.outcome == 'success' }}
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature '${{ steps.package.outputs.path }}'
          if ($signature.Status -ne 'Valid') { throw "Signature status: $($signature.Status)" }
          "Signed by $($signature.SignerCertificate.Subject)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Record SHA-256
        shell: bash
        run: sha256sum "${{ steps.package.outputs.path }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: simpleVoiceover-windows-x64
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
