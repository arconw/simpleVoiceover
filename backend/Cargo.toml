[package]
name = "simple-voiceover"
version = "1.3.0"
edition = "2024"

[features]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:webkit2gtk", "dep:libpulse-binding", "dep:tempfile", "dep:cc", "dep:pkg-config"]

[[bin]]
name = "simpleVoiceover"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
futures-util = "0.3"
symphonia = { version = "0.5.5", features = ["all"] }
shine-rs = "0.1.3"
zip = { version = "2.4", default-features = false }
crc32fast = "1"
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ebur128 = "=0.1.10"
rfd = { version = "0.15", default-features = false, optional = true }
tauri = { version = "2.12.1", optional = true , features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, optional = true, features = ["xdg-portal", "tokio"] }
webkit2gtk = { version = "2.0.2", optional = true, features = ["v2_40"] }
libpulse-binding = { version = "2.30.1", optional = true }
tempfile = { version = "3", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
